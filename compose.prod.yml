services:
  fe:
    build:
      target: prod
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-https://api-tlg.${DOMAIN:-site.example}}
      - NUXT_PUBLIC_WS_URL=${NUXT_PUBLIC_WS_URL:-wss://api-tlg.${DOMAIN:-site.example}}
    expose:
      - "3000"
    volumes:
      - ./questions:/app/questions:ro
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tlg-front-http.rule=Host(`tlg.${DOMAIN:-site.example}`)"
      - "traefik.http.routers.tlg-front-http.entrypoints=web"
      - "traefik.http.routers.tlg-front-http.middlewares=tlg-front-https-redirect"
      - "traefik.http.middlewares.tlg-front-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.tlg-front.rule=Host(`tlg.${DOMAIN:-site.example}`)"
      - "traefik.http.routers.tlg-front.entrypoints=websecure"
      - "traefik.http.routers.tlg-front.tls.certresolver=myresolver"
      - "traefik.http.services.tlg-front.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.tlg-front-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.tlg-front-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.tlg-front-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.tlg-front-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.tlg-front-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.tlg-front-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.tlg-front-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.tlg-front-compress.compress=true"
      - "traefik.http.routers.tlg-front.middlewares=tlg-front-headers,tlg-front-compress"
    depends_on:
      - be
    restart: unless-stopped

  be:
    build:
      target: prod
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:password@db:5432/game_db}
      - QUESTIONS_DIR=${QUESTIONS_DIR:-/app/questions}
    expose:
      - "4000"
    volumes:
      - ./questions:/app/questions:ro
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tlg-api-http.rule=Host(`api-tlg.${DOMAIN:-site.example}`)"
      - "traefik.http.routers.tlg-api-http.entrypoints=web"
      - "traefik.http.routers.tlg-api-http.middlewares=tlg-api-https-redirect"
      - "traefik.http.middlewares.tlg-api-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.tlg-api.rule=Host(`api-tlg.${DOMAIN:-site.example}`)"
      - "traefik.http.routers.tlg-api.entrypoints=websecure"
      - "traefik.http.routers.tlg-api.tls.certresolver=myresolver"
      - "traefik.http.services.tlg-api.loadbalancer.server.port=4000"
      - "traefik.http.middlewares.tlg-api-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.tlg-api-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.tlg-api-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.tlg-api-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.tlg-api-rl.ratelimit.average=50"
      - "traefik.http.middlewares.tlg-api-rl.ratelimit.burst=100"
      - "traefik.http.routers.tlg-api.middlewares=tlg-api-headers,tlg-api-rl"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-game_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    external: true
    name: ${TRAEFIK_NETWORK:-main_app-network}

volumes:
  postgres_data:
