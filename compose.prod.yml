name: tlg
services:
  app:
    image: ${TLG_KIT_IMAGE:-tlg-kit:svelte-only}
    build: ./kit
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      ORIGIN: https://tlg.${DOMAIN:-site.example}
      QUESTIONS_DIR: ${QUESTIONS_DIR:-/app/questions}
    volumes:
      - ./questions:/app/questions:ro
    networks: [app-network, internal]
    expose: ['3000']
    restart: unless-stopped
    stop_grace_period: 12s
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${TRAEFIK_NETWORK:-main_app-network}
      traefik.http.routers.tlg-kit-http.rule: Host(`tlg.${DOMAIN:-site.example}`)
      traefik.http.routers.tlg-kit-http.entrypoints: web
      traefik.http.routers.tlg-kit-http.middlewares: tlg-kit-https
      traefik.http.middlewares.tlg-kit-https.redirectscheme.scheme: https
      traefik.http.routers.tlg-kit.rule: Host(`tlg.${DOMAIN:-site.example}`)
      traefik.http.routers.tlg-kit.entrypoints: websecure
      traefik.http.routers.tlg-kit.tls.certresolver: myresolver
      traefik.http.routers.tlg-kit.middlewares: tlg-kit-headers,tlg-kit-rate,tlg-kit-compress
      traefik.http.middlewares.tlg-kit-headers.headers.stsSeconds: '31536000'
      traefik.http.middlewares.tlg-kit-headers.headers.stsIncludeSubdomains: 'true'
      traefik.http.middlewares.tlg-kit-headers.headers.contentTypeNosniff: 'true'
      traefik.http.middlewares.tlg-kit-headers.headers.frameDeny: 'true'
      traefik.http.middlewares.tlg-kit-headers.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.tlg-kit-rate.ratelimit.average: '50'
      traefik.http.middlewares.tlg-kit-rate.ratelimit.burst: '100'
      traefik.http.middlewares.tlg-kit-compress.compress: 'true'
      traefik.http.services.tlg-kit.loadbalancer.server.port: '3000'
  db:
    image: postgres:19.0-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-game_db}
    volumes:
      - postgres19_data:/var/lib/postgresql
    # Keep the database off the shared Traefik network: other stacks there also use the "db" alias.
    networks:
      internal:
        aliases:
          - tlg-db
    restart: unless-stopped

networks:
  app-network:
    external: true
    name: ${TRAEFIK_NETWORK:-main_app-network}
  internal: {}

volumes:
  postgres19_data:
