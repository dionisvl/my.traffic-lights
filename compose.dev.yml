services:
  app:
    depends_on:
      db:
        condition: service_healthy
    environment:
      ORIGIN: http://localhost:3000
    ports:
      - '127.0.0.1:3000:3000'
    labels: !reset []
  db:
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ./kit/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
networks:
  app-network:
    external: false
    name: !reset null
